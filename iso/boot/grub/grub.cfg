serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1 --rtscts=off
terminal_input console serial
terminal_output console serial

set default="0"
set timeout="10"

menuentry "OpenWrt 25.12.5 x86_64 Installer (RAM)" {
	linux /boot/vmlinuz console=tty1 console=ttyS0,115200n8 rdinit=/init
	initrd /boot/initramfs.cpio.gz
}

menuentry "Download latest OpenWrt x86 image and install" {
	linux /boot/vmlinuz console=tty1 console=ttyS0,115200n8 rdinit=/init owrt.netinstall=1
	initrd /boot/initramfs.cpio.gz
}

menuentry "Boot installed OpenWrt from local disk" {
	if search --no-floppy --label kernel --set=owrt_local_boot; then
		configfile ($owrt_local_boot)/boot/grub/grub.cfg
	else
		echo "No installed OpenWrt boot partition with label 'kernel' was found."
		sleep 5
	fi
}

menuentry "OpenWrt 25.12.5 x86_64 Mouse hardware test (no disk writes)" {
	linux /boot/vmlinuz console=tty1 console=ttyS0,115200n8 rdinit=/init owrt.mouse=1 owrt.hardware-test=1
	initrd /boot/initramfs.cpio.gz
}

menuentry "OpenWrt 25.12.5 x86_64 Installer (experimental mouse)" {
	linux /boot/vmlinuz console=tty1 console=ttyS0,115200n8 rdinit=/init owrt.mouse=1
	initrd /boot/initramfs.cpio.gz
}

menuentry "OpenWrt 25.12.5 x86_64 Installer (RAM, failsafe)" {
	linux /boot/vmlinuz failsafe=true console=tty1 console=ttyS0,115200n8 rdinit=/init
	initrd /boot/initramfs.cpio.gz
}
